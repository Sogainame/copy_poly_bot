# =====================================================
# Copy Poly Bot конфиг
# Чтобы сменить трейдера — поменяй target_wallet и перезапусти бот.
# =====================================================

# Адрес которого копируем
target_wallet: "0xc6587b11a2209e46dfe3928b31c5514a8e33b784"

# Размер ставки
bet_pct: 0.10            # 10% от его сделки
bet_min: 1.0             # минимум $1 (Polymarket min order)
bet_max: 10.0            # максимум $10 на одну сделку

# Фильтр маркетов (что копируем)
# Возможные: btc-5m, btc-15m, eth-5m, eth-15m, sol-5m, sol-15m, xrp-5m, xrp-15m
filter_markets:
  - btc-5m
  - btc-15m
  - eth-5m
  - eth-15m
  - sol-5m
  - sol-15m
  - xrp-5m
  - xrp-15m

# Минимальный размер его сделки в shares (отсекает rewards/артефакты)
min_size_shares: 0

# Polling
poll_interval: 0.5       # секунд между опросами Data API
api_limit: 20            # сколько последних сделок брать за запрос
max_retries: 5           # попыток при HTTP 429 или ошибке

# Режим работы: dry или live
# dry — только логи, никаких ордеров
# live — реальные ордера (требует credentials в .env)
mode: dry
