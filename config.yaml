# =====================================================
# Copy Poly Bot конфиг
# Чтобы сменить трейдера — поменяй target_wallet и перезапусти бот.
# =====================================================

# Адрес которого копируем
target_wallet: "0x488c725253fc21c7a9ca812030dc2f6343f98c1c"

# Размер ставки
bet_pct: 0.10            # 10% от его сделки
bet_min: 1.0             # минимум $1 (Polymarket min order)
bet_max: 10.0            # максимум $10 на одну сделку

# Фильтр маркетов: КЛЮЧЕВЫЕ СЛОВА в названии маркета (title).
# Копируется только если в title есть хотя бы одно из слов (case-insensitive).
# Пустой список [] = копируем ВСЁ что трейдер делает.
#
# Примеры:
#   filter_keywords: ["Bitcoin", "Ethereum", "Solana", "XRP"]   # крипто Up/Down
#   filter_keywords: ["Iran", "Trump", "Fed", "Hormuz"]          # политика
#   filter_keywords: ["NFL", "NBA"]                              # спорт
#   filter_keywords: []                                          # ВСЁ что он делает
filter_keywords: []

# DEPRECATED — оставлено для обратной совместимости, не используется
filter_markets: []

# Минимальный размер его сделки в shares (отсекает rewards/артефакты)
min_size_shares: 0

# Polling
poll_interval: 0.5       # секунд между опросами Data API
api_limit: 20            # сколько последних сделок брать за запрос
max_retries: 5           # попыток при HTTP 429 или ошибке

# Режим работы: dry или live
# dry — только логи, никаких ордеров
# live — реальные ордера (требует credentials в .env)
mode: dry
